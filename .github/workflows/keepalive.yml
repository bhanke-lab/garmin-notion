name: Keep Alive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        run: |
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/sync.yml/enable
          gh api -X PUT repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}